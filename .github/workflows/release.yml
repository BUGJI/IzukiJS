name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 16 起已移除 'tools' 包，默认会安装失败，这里只装 platform-tools。
          packages: 'platform-tools'

      # compileSdk 37 需要对应平台；build-tools 缺失时由 AGP 兜底。
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-37"
        continue-on-error: true

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 未提供 keystore.properties 时回退 debug 签名，仅用于分发验证。
      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES="$(cat <<'EOF'
          ### 下载说明

          - 手机用户：优先下载 `app-arm64-v8a-release.apk`；若设备不支持或安装失败，再尝试 `app-armeabi-v7a-release.apk`。
          - X86 架构设备或模拟器：请下载 `app-x86_64-release.apk`。
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
            BODY="$(gh release view "$TAG" --json body -q .body)"
            if ! printf '%s' "$BODY" | grep -qF 'app-arm64-v8a-release.apk'; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$NOTES" "$BODY")"
            fi
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --notes "$NOTES" \
              app/build/outputs/apk/release/*.apk
          fi
