name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 16 起已移除 'tools' 包，默认会安装失败，这里只装 platform-tools。
          packages: 'platform-tools'

      # compileSdk 37 需要对应平台；build-tools 缺失时由 AGP 兜底。
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-37"
        continue-on-error: true

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 固定发布签名。之前没有注入 keystore，release 会回退到 debug 签名，
      # 而 GitHub runner 每次都是全新的 ~/.android/debug.keystore，
      # 于是每个版本的证书都不一样，旧版本无法覆盖安装。这里改为缺 keystore 直接失败。
      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/izukijs-release.jks
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少仓库 secret KEYSTORE_BASE64，拒绝用 debug 签名发布"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore 已写入 $KEYSTORE_PATH"

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      # 把 AGP 的 app-* 产物重命名为稳定的 izukijs-* 资源名并集中暂存。
      # Release 简介里的 latest/download 链接依赖固定文件名，任一产物缺失都直接失败。
      - name: Stage release assets
        run: |
          set -euo pipefail
          ASSETS="${RUNNER_TEMP}/release-assets"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            case "$base" in
              *universal*)   out="izukijs-universal-release.apk" ;;
              *arm64-v8a*)   out="izukijs-arm64-v8a-release.apk" ;;
              *armeabi-v7a*) out="izukijs-armeabi-v7a-release.apk" ;;
              *x86_64*)      out="izukijs-x86_64-release.apk" ;;
              *) echo "::error::无法识别的产物：$base"; exit 1 ;;
            esac
            cp "$apk" "$ASSETS/$out"
          done
          for f in izukijs-universal-release.apk izukijs-arm64-v8a-release.apk \
                   izukijs-armeabi-v7a-release.apk izukijs-x86_64-release.apk; do
            test -f "$ASSETS/$f" || { echo "::error::缺少 $f"; exit 1; }
          done
          ls -lh "$ASSETS"

      # 上传前断言证书指纹，防止再次发布出签名不一致的包。
      - name: Verify release signature
        run: |
          set -euo pipefail
          EXPECTED="95392aa229296dbe946c52328450e22b73fc05b417e068dbf6ba2193a7771ea5"
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          fi
          echo "apksigner: $APKSIGNER"
          for apk in "${RUNNER_TEMP}"/release-assets/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -20
            GOT="$("$APKSIGNER" verify --print-certs "$apk" \
              | awk '/certificate SHA-256 digest/{print $NF; exit}' | tr 'A-F' 'a-f')"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::签名指纹不匹配：$apk -> $GOT"
              exit 1
            fi
            echo "OK: $apk"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS="${RUNNER_TEMP}/release-assets"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/izukijs-universal-release.apk"

          # 简介只保留一个通用下载入口，面向新用户，不介绍包本身。
          DOWNLOAD_BLOCK="$(printf '### 下载\n\n**[下载 APK](%s)**' "$DOWNLOAD_URL")"

          # 更新内容取 CHANGELOG 中对应 tag 的小节；缺失时回退到 GitHub 生成说明。
          VERSION="${TAG#v}"
          NOTES="$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            # 生成失败不应阻断发版，最多让更新内容留空。
            NOTES="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body 2>/dev/null || true)"
          fi

          BODY="$(printf '%s\n\n<details>\n<summary>更新内容</summary>\n\n%s\n\n</details>\n' \
            "$DOWNLOAD_BLOCK" "$NOTES")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSETS"/*.apk --clobber
            EXISTING="$(gh release view "$TAG" --json body -q .body)"
            # 已经是最新简介格式时保持原样，避免覆盖人工修改。
            if ! printf '%s' "$EXISTING" | grep -qF 'izukijs-universal-release.apk'; then
              gh release edit "$TAG" --notes "$BODY"
            fi
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$BODY" \
              "$ASSETS"/*.apk
          fi
