name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 16 起已移除 'tools' 包，默认会安装失败，这里只装 platform-tools。
          packages: 'platform-tools'

      # compileSdk 37 需要对应平台；build-tools 缺失时由 AGP 兜底。
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-37"
        continue-on-error: true

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 固定发布签名。之前没有注入 keystore，release 会回退到 debug 签名，
      # 而 GitHub runner 每次都是全新的 ~/.android/debug.keystore，
      # 于是每个版本的证书都不一样，旧版本无法覆盖安装。这里改为缺 keystore 直接失败。
      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/izukijs-release.jks
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少仓库 secret KEYSTORE_BASE64，拒绝用 debug 签名发布"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore 已写入 $KEYSTORE_PATH"

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      # 上传前断言证书指纹，防止再次发布出签名不一致的包。
      - name: Verify release signature
        run: |
          set -euo pipefail
          EXPECTED="95392aa229296dbe946c52328450e22b73fc05b417e068dbf6ba2193a7771ea5"
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          fi
          echo "apksigner: $APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | head -20
            GOT="$("$APKSIGNER" verify --print-certs "$apk" \
              | awk '/certificate SHA-256 digest/{print $NF; exit}' | tr 'A-F' 'a-f')"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::签名指纹不匹配：$apk -> $GOT"
              exit 1
            fi
            echo "OK: $apk"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES="$(cat <<'EOF'
          ### 下载说明

          - 手机用户：优先下载 `app-arm64-v8a-release.apk`；若设备不支持或安装失败，再尝试 `app-armeabi-v7a-release.apk`。
          - X86 架构设备或模拟器：请下载 `app-x86_64-release.apk`。
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
            BODY="$(gh release view "$TAG" --json body -q .body)"
            if ! printf '%s' "$BODY" | grep -qF 'app-arm64-v8a-release.apk'; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$NOTES" "$BODY")"
            fi
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --notes "$NOTES" \
              app/build/outputs/apk/release/*.apk
          fi
